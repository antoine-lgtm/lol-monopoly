<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 210">
  <!-- Sort Téléportation : silhouette au cœur d'une colonne d'énergie violette -->
  <defs>
    <radialGradient id="energy" cx=".5" cy=".55" r=".62">
      <stop offset="0" stop-color="#e7c9ff"/>
      <stop offset=".22" stop-color="#b273ff"/>
      <stop offset=".55" stop-color="#5a1fb0"/>
      <stop offset=".85" stop-color="#220944"/>
      <stop offset="1" stop-color="#0d0420"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2e2ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#f2e2ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f2e2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f4d"/>
      <stop offset="1" stop-color="#140628"/>
    </linearGradient>
    <radialGradient id="ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4e4ff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#b87cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7a35d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".7">
      <stop offset=".55" stop-color="#05010c" stop-opacity="0"/>
      <stop offset="1" stop-color="#05010c" stop-opacity=".85"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="grow"/>
      <feGaussianBlur in="grow" stdDeviation="2.4" result="glow"/>
      <feFlood flood-color="#e6c8ff"/>
      <feComposite in2="glow" operator="in" result="rimglow"/>
      <feMerge><feMergeNode in="rimglow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- personnage encapuchonné, cape ouverte, bras légèrement écartés -->
    <path id="hood" d="M90 32c10 0 16 9 15 20-1 9-7 15-15 16-8-1-14-7-15-16-1-11 5-20 15-20z"/>
    <path id="figure" d="M77 63c-9 4-18 9-22 17l-12 50c-2 8 0 16 4 20l6-4 6-36 2 40-4 56h66l-4-56 2-40 6 36 6 4c4-4 6-12 4-20l-12-50c-4-8-13-13-22-17-4 5-8 7-13 7s-9-2-13-7z"/>
    <linearGradient id="dissolve" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#fff"/>
      <stop offset=".97" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="210">
      <rect width="180" height="210" fill="url(#dissolve)"/>
    </mask>
  </defs>

  <rect width="180" height="210" fill="url(#energy)"/>

  <!-- traînées de lumière qui montent -->
  <g filter="url(#blur1)">
    <rect x="22" y="10" width="3" height="190" fill="url(#streak)" opacity=".35"/>
    <rect x="40" y="30" width="5" height="170" fill="url(#streak)" opacity=".55"/>
    <rect x="58" y="0" width="2" height="150" fill="url(#streak)" opacity=".45"/>
    <rect x="121" y="20" width="2" height="160" fill="url(#streak)" opacity=".5"/>
    <rect x="136" y="5" width="6" height="190" fill="url(#streak)" opacity=".5"/>
    <rect x="156" y="40" width="3" height="150" fill="url(#streak)" opacity=".35"/>
  </g>
  <ellipse cx="90" cy="118" rx="46" ry="92" fill="#c38bff" opacity=".35" filter="url(#blur4)"/>

  <!-- cercle lumineux au sol -->
  <ellipse cx="90" cy="198" rx="70" ry="16" fill="url(#ground)"/>
  <ellipse cx="90" cy="198" rx="54" ry="10" fill="none" stroke="#f4e6ff" stroke-width="1.5" opacity=".8"/>

  <!-- silhouette, cernée de lumière -->
  <g mask="url(#fade)">
    <g filter="url(#rim)">
      <use href="#hood" fill="url(#body)"/>
      <use href="#figure" fill="url(#body)"/>
    </g>
    <!-- plis de la cape, à peine éclairés -->
    <path d="M90 72v60M76 84l-4 50M104 84l4 50" stroke="#6b33b8" stroke-width="1.2" opacity=".6" fill="none"/>
  </g>
  <!-- traînées devant le bas du corps : il se dissout dans le TP -->
  <g filter="url(#blur1)" opacity=".8">
    <rect x="74" y="120" width="3" height="90" fill="url(#streak)"/>
    <rect x="96" y="100" width="4" height="110" fill="url(#streak)"/>
    <rect x="110" y="140" width="2" height="70" fill="url(#streak)"/>
  </g>

  <!-- particules -->
  <g fill="#fbf2ff">
    <circle cx="34" cy="150" r="1.4" opacity=".8"/>
    <circle cx="50" cy="96" r="1" opacity=".6"/>
    <circle cx="146" cy="120" r="1.6" opacity=".8"/>
    <circle cx="130" cy="64" r="1" opacity=".6"/>
    <circle cx="70" cy="30" r="1.1" opacity=".5"/>
    <circle cx="112" cy="176" r="1.3" opacity=".7"/>
    <circle cx="28" cy="70" r=".9" opacity=".5"/>
    <circle cx="160" cy="170" r="1.1" opacity=".6"/>
  </g>

  <rect width="180" height="210" fill="url(#vignette)"/>
</svg>
